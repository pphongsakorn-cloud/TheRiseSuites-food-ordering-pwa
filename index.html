<html lang="en">

  <style>
    :root{--gold:#b97812;--gold2:#d59b35;--cream:#fbf7ef;--ink:#231f1a;--muted:#756e64;--line:#eadfce;--ok:#43835f;--danger:#b13c32;--shadow:0 14px 38px rgba(77,49,12,.12)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--cream)}button,input,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;max-width:560px;margin:auto;background:#fff;position:relative;padding-bottom:78px}.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand-name{letter-spacing:.24em;color:#98703a;font-size:15px;font-weight:650}.room-pill{border:1px solid var(--line);background:var(--cream);border-radius:999px;padding:7px 11px;font-size:13px}.langs{display:flex;gap:6px;margin-top:9px}.langs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px;font-size:12px}.langs button.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border-color:transparent}.view{padding:18px 16px 26px}.hero{min-height:400px;border-radius:24px;padding:28px 22px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(180deg,rgba(30,22,12,.05),rgba(30,22,12,.8)),radial-gradient(circle at 70% 20%,#dcc498,#80633f);box-shadow:var(--shadow)}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-family:Georgia,serif;font-size:35px;line-height:1.05;margin:10px 0}.hero p{line-height:1.55;margin:0 0 20px}.primary,.secondary{width:100%;border-radius:12px;padding:14px 16px;font-weight:700}.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 9px 18px rgba(185,120,18,.22)}.secondary{margin-top:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 16px}.section-title h1{font-size:24px;margin:0}.back{border:0;background:transparent;font-size:23px;padding:4px}.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:13px}.chip.active{background:var(--gold);border-color:var(--gold);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 6px 18px rgba(74,51,21,.06)}.food-img,.catalog-img{display:block;width:100%;background:linear-gradient(135deg,#f2e8d7,#d8b980);object-fit:cover}.food-img{aspect-ratio:1.2}.catalog-img{min-height:250px;object-fit:contain}.image-fallback{display:grid;place-items:center;color:#98703a}.card-body{padding:12px}.card h3{font-size:15px;margin:0 0 5px}.desc{color:var(--muted);font-size:12px;line-height:1.4;min-height:33px}.price-row,.qty-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.price{font-weight:750;color:#8f5909}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:50%}.cart-bar{position:sticky;bottom:86px;margin:14px 0 0;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#fff;border:0;border-radius:13px;padding:14px 16px;width:100%;font-weight:700;box-shadow:var(--shadow)}.line{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.line h3{font-size:15px;margin:0 0 5px}.line-meta{font-size:13px;color:var(--muted)}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:750;padding:18px 0}.note{width:100%;min-height:92px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}.history-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}.history-head{display:flex;justify-content:space-between;gap:8px}.status{color:var(--gold);font-weight:750;font-size:12px}.success{text-align:center;padding:38px 10px}.check{width:82px;height:82px;border:3px solid var(--gold);color:var(--gold);border-radius:50%;display:grid;place-items:center;font-size:42px;margin:0 auto 18px}.success h1{font-family:Georgia,serif}.empty,.error{padding:30px 16px;text-align:center;color:var(--muted)}.error{color:var(--danger)}.spinner{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:70px auto}@keyframes spin{to{transform:rotate(360deg)}}.nav{position:fixed;z-index:12;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:var(--muted);padding:7px 2px;font-size:11px}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{color:var(--gold)}.toast{position:fixed;z-index:20;left:50%;bottom:95px;transform:translateX(-50%);width:min(500px,calc(100% - 32px));background:#29241e;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:var(--shadow)}[hidden]{display:none!important}@media(min-width:560px){body{padding:20px 0}.app{border-radius:24px;overflow:hidden;box-shadow:var(--shadow);min-height:calc(100vh - 40px)}.nav{bottom:20px;border-radius:0 0 24px 24px}}
    .official-logo{display:block;width:155px;height:47px;object-fit:contain;object-position:left center}
    .totals{margin:14px 0;border-top:1px solid var(--line);padding-top:10px}.total-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--muted);font-size:14px}.total-row.net{color:var(--ink);font-size:20px;font-weight:750;border-top:1px solid var(--line);margin-top:5px;padding-top:12px}.tax-note{font-size:11px;color:var(--muted);margin:4px 0 12px}.pager{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:18px 0 4px}.pager button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;color:var(--ink);font-weight:650}.pager button:last-child{justify-self:stretch}.pager button:disabled{opacity:.35;cursor:default}.page-count{font-size:13px;color:var(--muted);white-space:nowrap}.addon-section{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.addon-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:10px}.addon-title h2{font-size:18px;margin:0}.addon-title span{font-size:11px;color:var(--muted);text-align:right}.addon-strip{display:flex;gap:10px;overflow:auto;padding:2px 1px 10px;scrollbar-width:none}.addon-card{flex:0 0 142px}.addon-card .food-img{aspect-ratio:1.55}.addon-card .card-body{padding:10px}.addon-card .desc{display:none}.addon-card h3{min-height:38px}.addon-card .price-row{display:block}.addon-card .qty{justify-content:space-between;margin-top:8px}.addon-card button:disabled{opacity:.35;cursor:default}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><img class="official-logo" src="./logo.png" alt="The Rise Suites"><div class="room-pill" id="roomPill">Room —</div></div>
      <div class="langs" aria-label="Language"><button data-lang="en">🇬🇧 English</button><button data-lang="th">🇹🇭 ไทย</button><button data-lang="zh">🇨🇳 中文</button></div>
    </header>
    <section id="view" class="view"><div class="spinner" aria-label="Loading"></div></section>
    <nav class="nav" id="nav" hidden>
      <button data-page="home"><span>⌂</span><b data-i18n="home">Home</b></button>
      <button data-page="catalog"><span>▤</span><b data-i18n="catalog">Catalog</b></button>
      <button data-page="order"><span>＋</span><b data-i18n="order">Order</b></button>
      <button data-page="history"><span>◷</span><b data-i18n="history">History</b></button>
    </nav>
    <div id="toast" class="toast" hidden></div>
  </main>
  <script>
  (() => {
    'use strict';
    const T={
      en:{home:'Home',catalog:'Menu',order:'Order',history:'History',welcome:'Welcome',hero:'Enjoy delicious food delivered to your room.',orderNow:'Order now',viewHistory:'Order history',menu:'Order food',all:'All',cart:'Cart',items:'items',total:'Total',subtotal:'Subtotal (excl. VAT)',vat:'VAT 7%',net:'Net total',taxExcluded:'Menu prices exclude 7% VAT.',special:'Special request (optional)',noteHint:'e.g. No spicy, no onion',place:'Place order',thank:'Thank you!',placed:'Your order has been placed.',backHome:'Back to home',emptyCart:'Your cart is empty.',emptyHistory:'No orders in the current bill.',emptyCatalog:'Menu pages will appear here.',emptyMenu:'Menu items will appear here.',retry:'Try again',loading:'Loading…',room:'Room',previous:'Previous',next:'Next',page:'Page',addOns:'Add-ons',selectMainFirst:'Select a main item first'},
      th:{home:'หน้าหลัก',catalog:'เมนู',order:'สั่งอาหาร',history:'ประวัติ',welcome:'ยินดีต้อนรับ',hero:'อิ่มอร่อยกับอาหารส่งตรงถึงห้องพักของคุณ',orderNow:'สั่งอาหาร',viewHistory:'ดูประวัติการสั่ง',menu:'สั่งอาหาร',all:'ทั้งหมด',cart:'รถเข็น',items:'รายการ',total:'รวม',subtotal:'ราคาก่อน VAT',vat:'VAT 7%',net:'ราคาสุทธิ',taxExcluded:'ราคาอาหารยังไม่รวม VAT 7%',special:'คำขอพิเศษ (ไม่บังคับ)',noteHint:'เช่น ไม่เผ็ด ไม่ใส่หอม',place:'ยืนยันการสั่ง',thank:'ขอบคุณครับ',placed:'ระบบรับออร์เดอร์ของคุณแล้ว',backHome:'กลับหน้าหลัก',emptyCart:'ยังไม่มีรายการในรถเข็น',emptyHistory:'ยังไม่มีออร์เดอร์ในบิลปัจจุบัน',emptyCatalog:'รูปภาพเมนูจะแสดงที่นี่',emptyMenu:'รายการอาหารจะแสดงที่นี่',retry:'ลองอีกครั้ง',loading:'กำลังโหลด…',room:'ห้อง',previous:'ก่อนหน้า',next:'ถัดไป',page:'หน้า',addOns:'รายการเพิ่มเติม',selectMainFirst:'เลือกเมนูหลักก่อน'},
      zh:{home:'首页',catalog:'菜单',order:'点餐',history:'历史',welcome:'欢迎',hero:'享用送至客房的美味餐点。',orderNow:'立即点餐',viewHistory:'订单历史',menu:'点餐',all:'全部',cart:'购物车',items:'项',total:'总计',subtotal:'税前小计',vat:'增值税 7%',net:'应付总额',taxExcluded:'菜单价格不含 7% 增值税。',special:'特别要求（可选）',noteHint:'例如：不辣、不加洋葱',place:'提交订单',thank:'谢谢！',placed:'您的订单已提交。',backHome:'返回首页',emptyCart:'购物车是空的。',emptyHistory:'当前账单没有订单。',emptyCatalog:'菜单图片将显示在这里。',emptyMenu:'菜品将显示在这里。',retry:'重试',loading:'加载中…',room:'房间',previous:'上一页',next:'下一页',page:'第',addOns:'加购选项',selectMainFirst:'请先选择主菜'}
    };
    const PAGE_SIZE=8;
    const state={room:'',lang:localStorage.getItem('rise-food-lang')||'en',context:null,catalog:[],categories:[],menu:[],addOnRules:[],cart:{},note:'',page:'home',selectedCategory:'',menuPage:1,confirmation:null};
    const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const tr=k=>T[state.lang][k]||T.en[k]||k;
    const BRIDGE_URL='https://script.google.com/macros/s/AKfycbzjDRj-qwqoBXqrOBbXMphiTlIiuS_3pxvqdhBq9yfr9k_NwxT9Wjg9Kz0Wj_Ln17JCyw/exec?view=bridge';
    const BRIDGE_TOKEN=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
    const pending=new Map();let bridgeWindow=null,bridgeSequence=0,bridgeReadyResolve,bridgeReadyReject;
    const bridgeReady=new Promise((resolve,reject)=>{bridgeReadyResolve=resolve;bridgeReadyReject=reject});
    function initBridge(){const frame=document.createElement('iframe');frame.title='The Rise Suites secure service';frame.setAttribute('aria-hidden','true');frame.style.cssText='position:fixed;width:1px;height:1px;left:-9999px;top:-9999px;border:0';frame.src=BRIDGE_URL+'&parentOrigin='+encodeURIComponent(location.origin)+'&token='+encodeURIComponent(BRIDGE_TOKEN);document.body.appendChild(frame);setTimeout(()=>bridgeReadyReject({code:'SERVICE_TIMEOUT',message:'Service unavailable.'}),15000)}
    window.addEventListener('message',event=>{const message=event.data;if(!message||message.token!==BRIDGE_TOKEN)return;if(message.type==='rise-bridge-ready'){bridgeWindow=event.source;bridgeReadyResolve();return}if(message.type!=='rise-bridge-response'||!pending.has(message.id))return;const request=pending.get(message.id);pending.delete(message.id);if(message.result&&message.result.success)request.resolve(message.result.data);else request.reject(message.result&&message.result.error?message.result.error:{code:'INTERNAL_ERROR',message:'Unexpected response.'})});
    function call(name,...args){return bridgeReady.then(()=>new Promise((resolve,reject)=>{const id=String(++bridgeSequence);pending.set(id,{resolve,reject});bridgeWindow.postMessage({type:'rise-bridge-request',token:BRIDGE_TOKEN,id,name,args},'*');setTimeout(()=>{if(!pending.has(id))return;pending.delete(id);reject({code:'SERVICE_TIMEOUT',message:'Service unavailable.'})},30000)}));}
    function getRoomFromHost(){const queryRoom=new URLSearchParams(location.search).get('room')||'';if(queryRoom)localStorage.setItem('rise-food-room',queryRoom);return Promise.resolve(queryRoom||localStorage.getItem('rise-food-room')||'');}
    function nameOf(x){return x['name'+state.lang.toUpperCase()]||x.nameEN||x.nameTH||x.nameZH||''}function descOf(x){return x['description'+state.lang.toUpperCase()]||x.descriptionEN||x.descriptionTH||x.descriptionZH||''}
    function imageUrl(id,size=500){return id?'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+size:''}
    function showToast(message){const el=$('#toast');el.textContent=message;el.hidden=false;clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.hidden=true,3500)}
    function saveCart(){sessionStorage.setItem('rise-cart-'+state.room,JSON.stringify(state.cart))}function loadCart(){try{state.cart=JSON.parse(sessionStorage.getItem('rise-cart-'+state.room)||'{}')||{}}catch(e){state.cart={}}}
    function cartLines(){return state.menu.filter(x=>state.cart[x.menuId]>0).map(x=>({...x,quantity:state.cart[x.menuId],lineTotalMinor:x.priceMinor*state.cart[x.menuId]}))}function cartTotal(){return cartLines().reduce((s,x)=>s+x.lineTotalMinor,0)}function vatTotals(subtotal){const vat=Math.floor(subtotal/10000)*700+Math.round((subtotal%10000)*700/10000);return{subtotalMinor:subtotal,vatMinor:vat,netTotalMinor:subtotal+vat}}function fmt(n){return '฿'+(n/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}
    function totalsBlock(o){return `<div class="totals"><div class="total-row"><span>${esc(tr('subtotal'))}</span><strong>${fmt(o.subtotalMinor)}</strong></div><div class="total-row"><span>${esc(tr('vat'))}</span><strong>${fmt(o.vatMinor)}</strong></div><div class="total-row net"><span>${esc(tr('net'))}</span><span>${fmt(o.netTotalMinor)}</span></div></div><p class="tax-note">${esc(tr('taxExcluded'))}</p>`}
    function eligibleParentFor(addonId){const parents=state.addOnRules.filter(r=>r.addonMenuId===addonId).map(r=>r.parentCategoryId);return state.menu.some(x=>parents.includes(x.categoryId)&&(state.cart[x.menuId]||0)>0)}
    function pruneOrphanAddOns(){state.menu.filter(x=>x.categoryId==='TRS-CAT-EXTRAS'&&state.cart[x.menuId]&&!eligibleParentFor(x.menuId)).forEach(x=>delete state.cart[x.menuId])}
    function setQty(id,qty){if(qty>0)state.cart[id]=qty;else delete state.cart[id];pruneOrphanAddOns();saveCart();render()}
    function header(title,back){return `<div class="section-title">${back?'<button class="back" data-back aria-label="Back">‹</button>':''}<h1>${esc(title)}</h1><span></span></div>`}
    function home(){return `<div class="hero"><div class="eyebrow">${esc(tr('room'))} ${esc(state.context.displayNumber)}</div><h1>${esc(tr('welcome'))}<br>The Rise Suites</h1><p>${esc(tr('hero'))}</p><button class="primary" data-go="order">${esc(tr('orderNow'))}</button><button class="secondary" data-go="history">${esc(tr('viewHistory'))}</button></div>`}
    function catalog(){if(!state.catalog.length)return header(tr('catalog'))+`<div class="empty">${esc(tr('emptyCatalog'))}</div>`;return header(tr('catalog'))+state.catalog.map(p=>`<article class="card" style="margin-bottom:14px"><img class="catalog-img" src="${imageUrl(p.driveFileId,1200)}" alt="Catalog ${esc(p.pageId)}" loading="lazy"></article>`).join('')}
    function visibleCategories(){return state.categories.filter(c=>c.categoryId!=='TRS-CAT-EXTRAS')}
    function filteredMenu(){return state.menu.filter(x=>x.categoryId!=='TRS-CAT-EXTRAS'&&(!state.selectedCategory||x.categoryId===state.selectedCategory))}
    function allowedAddOns(){if(!state.selectedCategory)return[];const ids=state.addOnRules.filter(r=>r.parentCategoryId===state.selectedCategory).sort((a,b)=>a.sortOrder-b.sortOrder).map(r=>r.addonMenuId);const rank=Object.fromEntries(ids.map((id,i)=>[id,i]));return state.menu.filter(x=>rank[x.menuId]!==undefined).sort((a,b)=>rank[a.menuId]-rank[b.menuId])}
    function hasSelectedParent(){return state.menu.some(x=>x.categoryId===state.selectedCategory&&x.categoryId!=='TRS-CAT-EXTRAS'&&(state.cart[x.menuId]||0)>0)}
    function addOnCards(items){if(!items.length)return'';const enabled=hasSelectedParent();return `<section class="addon-section"><div class="addon-title"><h2>${esc(tr('addOns'))}</h2><span>${enabled?'':esc(tr('selectMainFirst'))}</span></div><div class="addon-strip">${items.map(x=>{const q=state.cart[x.menuId]||0;return `<article class="card addon-card">${x.driveFileId?`<img class="food-img" src="${imageUrl(x.driveFileId)}" alt="${esc(nameOf(x))}" loading="lazy">`:'<div class="food-img image-fallback">THE RISE</div>'}<div class="card-body"><h3>${esc(nameOf(x))}</h3><div class="price-row"><span class="price">${fmt(x.priceMinor)}</span><div class="qty"><button data-minus="${esc(x.menuId)}" ${q?'':'disabled'}>−</button><b>${q}</b><button data-plus="${esc(x.menuId)}" ${enabled?'':'disabled'}>+</button></div></div></div></article>`}).join('')}</div></section>`}
    function order(){const chips=[`<button class="chip${state.selectedCategory?'':' active'}" data-cat="">${esc(tr('all'))}</button>`].concat(visibleCategories().map(c=>`<button class="chip${state.selectedCategory===c.categoryId?' active':''}" data-cat="${esc(c.categoryId)}">${esc(nameOf(c))}</button>`));const filtered=filteredMenu();const totalPages=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));state.menuPage=Math.min(Math.max(1,state.menuPage),totalPages);const start=(state.menuPage-1)*PAGE_SIZE;const visible=filtered.slice(start,start+PAGE_SIZE);const preview=vatTotals(cartTotal());const pager=totalPages>1?`<div class="pager"><button data-menu-page="${state.menuPage-1}" ${state.menuPage===1?'disabled':''}>‹ ${esc(tr('previous'))}</button><span class="page-count">${esc(tr('page'))} ${state.menuPage} / ${totalPages}</span><button data-menu-page="${state.menuPage+1}" ${state.menuPage===totalPages?'disabled':''}>${esc(tr('next'))} ›</button></div>`:'';return header(tr('menu'))+`<div class="chips" id="chips">${chips.join('')}</div><div class="grid" id="menuGrid">${menuCards(visible)}</div>${pager}${addOnCards(allowedAddOns())}${cartLines().length?`<button class="cart-bar" data-go="cart"><span>${esc(tr('cart'))} (${cartLines().length})</span><strong>${fmt(preview.netTotalMinor)}</strong></button>`:''}`}
    function menuCards(items){if(!items.length)return `<div class="empty" style="grid-column:1/-1">${esc(tr('emptyMenu'))}</div>`;return items.map(x=>{const q=state.cart[x.menuId]||0;const addon=x.categoryId==='TRS-CAT-EXTRAS';return `<article class="card${addon?' addon-card':''}">${x.driveFileId?`<img class="food-img" src="${imageUrl(x.driveFileId)}" alt="${esc(nameOf(x))}" loading="lazy">`:'<div class="food-img image-fallback">THE RISE</div>'}<div class="card-body"><h3>${esc(nameOf(x))}</h3><div class="desc">${esc(descOf(x))}</div><div class="price-row"><span class="price">${fmt(x.priceMinor)}</span><div class="qty"><button data-minus="${esc(x.menuId)}">−</button><b>${q}</b><button data-plus="${esc(x.menuId)}">+</button></div></div></div></article>`}).join('')}
    function cart(){const lines=cartLines();if(!lines.length)return header(tr('cart'),true)+`<div class="empty">${esc(tr('emptyCart'))}</div><button class="primary" data-go="order">${esc(tr('orderNow'))}</button>`;return header(tr('cart'),true)+lines.map(x=>`<div class="line"><div><h3>${esc(nameOf(x))}</h3><div class="line-meta">${fmt(x.priceMinor)} × ${x.quantity}</div><div class="qty-row"><div class="qty"><button data-minus="${esc(x.menuId)}">−</button><b>${x.quantity}</b><button data-plus="${esc(x.menuId)}">+</button></div></div></div><strong>${fmt(x.lineTotalMinor)}</strong></div>`).join('')+`<label><p>${esc(tr('special'))}</p><textarea id="note" class="note" maxlength="500" placeholder="${esc(tr('noteHint'))}">${esc(state.note)}</textarea></label>${totalsBlock(vatTotals(cartTotal()))}<button class="primary" id="placeOrder">${esc(tr('place'))}</button>`}
    function confirmation(){const o=state.confirmation;return `<div class="success"><div class="check">✓</div><h1>${esc(tr('thank'))}</h1><p>${esc(tr('placed'))}</p><h2>#${esc(o.orderId.slice(0,8).toUpperCase())}</h2><p>${esc(tr('room'))} ${esc(o.displayNumber)}</p>${o.items.map(x=>`<div class="line"><span>${esc(nameOf(x))} × ${x.quantity}</span><strong>${fmt(x.lineTotalMinor)}</strong></div>`).join('')}${totalsBlock(o)}<button class="primary" data-go="home">${esc(tr('backHome'))}</button></div>`}
    function history(){const data=state.history;if(!data||!data.orders.length)return header(tr('history'))+`<div class="empty">${esc(tr('emptyHistory'))}</div>`;return header(tr('history'))+data.orders.map(o=>`<article class="history-card"><div class="history-head"><strong>#${esc(o.orderId.slice(0,8).toUpperCase())}</strong><span class="status">${esc(o.status)}</span></div><p class="line-meta">${esc(new Date(o.placedAt).toLocaleString())}</p>${o.items.map(x=>`<div class="price-row"><span>${esc(nameOf(x))} × ${x.quantity}</span><span>${fmt(x.lineTotalMinor)}</span></div>`).join('')}${totalsBlock(o)}</article>`).join('')}
    function render(){document.documentElement.lang=state.lang;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===state.lang));document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));$('#roomPill').textContent=tr('room')+' '+(state.context?state.context.displayNumber:'—');const views={home,catalog,order,cart,confirmation,history};$('#view').innerHTML=(views[state.page]||home)();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));bind()}
    function go(page){state.page=page;if(page==='history'){ $('#view').innerHTML='<div class="spinner"></div>';call('getGuestHistory',state.room).then(d=>{state.history=d;render()}).catch(showError);return}render()}
    function showError(error){$('#view').innerHTML=`<div class="error"><h2>${esc(error.code||'ERROR')}</h2><p>${esc(error.message||'Service unavailable.')}</p><button class="secondary" onclick="location.reload()">${esc(tr('retry'))}</button></div>`}
    function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>go('order'));document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>setQty(b.dataset.plus,(state.cart[b.dataset.plus]||0)+1));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>setQty(b.dataset.minus,(state.cart[b.dataset.minus]||0)-1));document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.selectedCategory=b.dataset.cat;state.menuPage=1;render()});document.querySelectorAll('[data-menu-page]').forEach(b=>b.onclick=()=>{if(b.disabled)return;state.menuPage=Number(b.dataset.menuPage);render();scrollTo({top:0,behavior:'smooth'})});const note=$('#note');if(note)note.oninput=e=>state.note=e.target.value;const place=$('#placeOrder');if(place)place.onclick=submitOrder}
    async function submitOrder(){const button=$('#placeOrder');button.disabled=true;button.textContent=tr('loading');try{const key=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));const payload={roomNumber:state.room,idempotencyKey:key,note:state.note,items:cartLines().map(x=>({menuId:x.menuId,quantity:x.quantity}))};state.confirmation=await call('placeOrder',payload);state.cart={};state.note='';saveCart();state.page='confirmation';render()}catch(e){button.disabled=false;button.textContent=tr('place');showToast(e.message||'Order failed.')}}
    document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;state.menuPage=1;localStorage.setItem('rise-food-lang',state.lang);render()});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
    async function boot(){initBridge();state.room=await getRoomFromHost();loadCart();try{state.context=await call('getGuestContext',state.room);const [catalogData,menuData,historyData]=await Promise.all([call('getCatalog',state.room),call('getMenu',state.room),call('getGuestHistory',state.room)]);state.catalog=catalogData.pages;state.categories=menuData.categories;state.menu=menuData.items;state.addOnRules=menuData.addOnRules||[];state.history=historyData;$('#nav').hidden=false;render()}catch(e){showError(e)}}boot();
  })();
  </script>
  <script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script>
</body>
